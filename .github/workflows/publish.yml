# Publish to npm when a version tag is pushed.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# ## Why a tag, and not a merge
#
# Publishing is the one action in this repository that cannot be taken back. An npm version can be
# deprecated, but the number itself is never reusable — publish a broken 1.0.1 and 1.0.1 is spent
# forever. So the trigger is a deliberate act that names the version, and the job re-runs the whole
# CI gate before anything leaves the machine. A merge says "this is good enough to be on main"; a
# tag says "this is what 1.0.1 is".
#
# ## Authentication: OIDC, not a token
#
# There is no `NPM_TOKEN` secret and no long-lived credential anywhere in this repository. The job
# authenticates to npm with the OIDC identity GitHub issues it, which npm verifies against a trusted
# publisher configured on the package. `npm publish` picks this up by itself once `id-token: write`
# is granted below.
#
# That is not a stylistic preference. npm revoked all classic tokens in December 2025, and the
# granular tokens that replaced them carry a 2FA-bypass capability npm is in the middle of
# restricting — direct publishing is announced as ending in January 2027. A trusted publisher is what
# npm recommends instead, and it is strictly better: there is no secret to leak, rotate, or expire.
# If you find an older document telling you to configure `NPM_TOKEN`, it is out of date.
#
# ## One-time setup
#
# On npmjs.com, for this package: Settings → Trusted Publisher → GitHub Actions. The four fields are
# matched literally; a typo in any of them shows up as a 403 at publish time and as nothing else.
#
#   Organization or user : xcisxc29
#   Repository           : dsh-qq
#   Workflow filename    : publish.yml
#   Environment          : (leave empty — this workflow declares none)
#
# The workflow filename is the file's name, not its path: `publish.yml`, not
# `.github/workflows/publish.yml`. That is the single most common way to get this wrong.
#
# ## Prerequisites
#
#   - The GitHub repository must be public: `--provenance` needs a public repository to produce a
#     signed attestation.
#   - `permissions.id-token: write` must stay in this file. Remove it and the publish fails, because
#     there is no other credential to fall back on.
#
# ## Dry run first
#
# Actions → Publish → Run workflow. `dry-run` defaults to true, so every check runs and nothing is
# published. Do that before pushing a tag for real.

name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and check without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  # Both halves of the handshake: npm reads this token to confirm that the workflow asking to
  # publish really is the one the package trusts.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The same gate as CI, repeated here on purpose. Since a burned version number never comes
      # back, the release path cannot rely on the CI run that happened to be green on some earlier
      # commit; it verifies the exact tree the tag points at. `tools/check-cross-plugin.mjs` and
      # `smoke/` are absent for the same reason they are absent from CI — see .github/workflows/ci.yml.
      - name: Syntax-check every source file
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          count=0
          for file in **/*.js **/*.mjs; do
            case "$file" in
              *node_modules*) continue ;;
            esac
            node --check "$file"
            count=$((count + 1))
          done
          echo "parsed $count .js/.mjs files"

      - name: Host-side checks
        run: node scripts/verify.mjs

      - name: Client-side checks
        run: node scripts/verify-client.mjs

      - name: No name is used without being imported
        run: node tools/check-unbound.mjs .

      - name: No import is left unused
        run: node tools/check-unused-imports.mjs .

      # A tag push is the only event where there is a tag to compare against, so the check is
      # skipped on a `workflow_dispatch` dry run started from a branch — `GITHUB_REF_NAME` there is
      # the branch name, and comparing "main" to a version number would fail every dry run.
      - name: Check the tag matches the manifest
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -eu
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $manifest"
            echo "bump package.json, commit, then tag again"
            exit 1
          fi
          echo "tag and manifest agree on $manifest"

      - name: Pack
        shell: bash
        run: |
          set -eu
          # This tarball is the artifact the next step publishes. Packing here rather than letting
          # `npm publish` pack for itself is what makes "verified" mean anything: the file that gets
          # uploaded is the file whose contents were just listed and checked.
          npm pack
          ls -l dsh-qq-plugin-*.tgz

      - name: Publish
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "dry run: everything above passed, skipping the publish"
            exit 0
          fi
          # Publish the tarball the previous step produced, never a second pack: re-packing could
          # pick up a different tree and would silently invalidate everything checked above.
          tarball=$(ls dsh-qq-plugin-*.tgz | sort | tail -n1)
          echo "publishing $tarball with OIDC"
          # No NODE_AUTH_TOKEN: with `id-token: write` npm exchanges the workflow's OIDC token for a
          # short-lived publish credential on its own. There is no secret to set.
          npm publish "$tarball" --provenance --access public
